version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/bin/sh", "-c", "cargo test --manifest-path /srv/backend/Cargo.toml --workspace && sleep infinity"]
    healthcheck:
      test: ["CMD", "test", "-f", "/srv/backend/Cargo.toml"]
      interval: 30s
      timeout: 5s
      retries: 3

  config-validator:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: ["python", "python/scripts/validate_config.py"]
