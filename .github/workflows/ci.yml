name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust tests
        run: cargo test --manifest-path backend/Cargo.toml --workspace

      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
